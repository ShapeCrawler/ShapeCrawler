name: Push

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            framework_version: 'net10.0'
          - os: ubuntu-latest
            framework_version: 'net10.0'
          - os: macos-14
            framework_version: 'net10.0'
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: |
          dotnet test --configuration Release --framework ${{ matrix.framework_version }} ShapeCrawler.Tests/ShapeCrawler.Tests.csproj
