version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-nuget-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      all-nuget-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "ClosedXML"
